# The Ops admin pages (/ops/...) in Slovak, the keys of ops.en.yml. The words as Zammad's Slovak UI has them:
# spúšťač (trigger), tiket, vlastník, skupina. Counts in parentheses or after a colon, the I18n backend has only one/other.
sk:
  ops:
    owner_handover:
      layout:
        site: Ops · Triáž
        back_to_triage: ← Triáž
        owner_handover: Odovzdanie
        language: Jazyk
      tabs:
        hand_over: Odovzdať vlastníka
        conflicts: Nezrovnalosti
        runs: Zmeny
      columns:
        group: Skupina
        trigger: Spúšťač
        tickets: Tikety
        test_tickets: Testovacie tikety
        new_owner: Nový vlastník
        goes_to: Prejdú na
        step: Typ
        from: Od
        to: Komu
        groups: Skupiny
        status: Stav
        queued: Zaradené
        started: Začaté
        finished: Skončené
        by: Zaradil
        queued_by: Zaradil
        routing_now: Smerovanie teraz
        routed_owner: Vlastník podľa spúšťača
        other_owner: Iný vlastník
        tickets_open: Tikety (otvorené)
      steps:
        triggers: spúšťače
        tickets: tikety
        tickets_routed: tikety vlastníkom podľa spúšťačov
      statuses:
        queued: v poradí
        running: beží
        done: hotovo
        failed: zlyhalo
      routing:
        none: túto skupinu nesmeruje žiaden aktívny spúšťač
        several: "smeruje ju viac spúšťačov: %{routes}"
        by: "%{user} spúšťačom %{triggers}"
      all_groups: všetky
      routed_owners: vlastníci podľa spúšťačov
      routed_owners_long: vlastník, ku ktorému skupinu smeruje jej spúšťač
      inactive: NEAKTÍVNY
      with_test: "%{tickets} + %{test} testovacích"
      back_to_handover: ← Späť na odovzdanie %{email}
      run_link: "zmena #%{id} %{status}"
      unknown_user: "neznámy používateľ #%{id}"
      at: o
      agent_field:
        placeholder: Hľadať…
      index:
        title: Odovzdanie
        intro: Ukáže skupiny, v ktorých má vlastník spúšťače alebo tikety, a krok za krokom ich odovzdá iným vlastníkom.
        agent_leaving: Odchádzajúci vlastník
        show_report: Ukázať prehľad
        no_user: Žiadny používateľ s e-mailom %{email}
      report:
        title: Odovzdanie %{email}
        heading: Odovzdanie %{user}
        running_html: "<strong>Beží:</strong> %{runs}. Stránka sa obnoví, keď skončí."
        next_triggers_html: "<strong>Ďalej: 1. odovzdajte spúšťače</strong>, pri každej skupine nižšie vyberte nového vlastníka."
        next_tickets_html: "<strong>Ďalej: 2. presuňte tikety</strong> nižšie."
        next_attention_html: "<strong>Ďalej: opravte v Zammade spúšťače</strong> skupín nižšie."
        complete_html: "<strong>Odovzdanie je hotové.</strong>"
        runs_heading: Zmeny pre tohto vlastníka
        run_ended_html: Zmena skončila. <a href="">Obnovte stránku</a>, aby ste videli, kde sú skupiny teraz (vybraní noví vlastníci sa pritom stratia).
        all_runs: Všetky zmeny
        triggers_heading: 1. Spúšťače (%{count})
        no_triggers: Žiaden spúšťač už nesmeruje skupinu k tomuto vlastníkovi.
        triggers_help: >-
          Pri každej skupine vyberte nového vlastníka, skupiny bez vlastníka zostanú, ako sú. Nový vlastník dostane
          prístup ku skupine a pôjdu mu nové tikety skupiny. Tikety, ktoré tam už sú, sa presunú v kroku 2.
        several_triggers: "viac spúšťačov, skupina má mať jeden: všetky prejdú na nového vlastníka"
        preview_triggers: Náhľad odovzdania spúšťačov (nič sa nezmení)
        tickets_heading: 2. Tikety (%{count})
        tickets_wait: Skupiny sa tu objavia, keď sa odovzdá ich spúšťač.
        no_tickets: Žiadne tikety na presun.
        tickets_help: >-
          Tikety prejdú vlastníkovi, ku ktorému skupinu smeruje jej spúšťač, aj uzavreté, bez notifikácií.
          Testovacie tikety zostanú tomuto vlastníkovi.
        preview_group: Náhľad pre túto skupinu
        preview_tickets:
          one: Náhľad presunu tiketov jednej skupiny (nič sa nezmení)
          other: "Náhľad presunu tiketov, skupín: %{count} (nič sa nezmení)"
        attention_heading: Treba vyriešiť (%{count})
        attention_help: >-
          Tikety zostali, ale skupinu nesmeruje k inému vlastníkovi práve jeden aktívny spúšťač. Opravte spúšťač skupiny
          v Zammade a potom obnovte túto stránku.
        done_heading: Hotové (%{count})
        done_help: "Zostali len testovacie tikety, tie zostávajú tomuto vlastníkovi: %{groups}"
        full_report_html: Celý textový prehľad (rovnaký ako <code>rake ops:owner_handover:report</code>, po anglicky)
      preview:
        title: "Náhľad: %{step}"
        no_owner: Vyberte nového vlastníka aspoň jednej skupiny.
        apply: Vykonať
        apply_help: >-
          Vykoná sa hneď na pozadí, potom sa vrátite na stránku odovzdania. Pri vykonaní sa všetko overí znova,
          výsledok sa môže od tohto náhľadu líšiť.
        apply_help_several: >-
          Vykoná sa hneď na pozadí, ako samostatné zmeny (%{count}) jedna po druhej, potom sa vrátite na stránku odovzdania.
          Pri vykonaní sa všetko overí znova, výsledok sa môže od tohto náhľadu líšiť.
      create_run:
        nothing: Nie je čo vykonať, spravte náhľad zmeny znova.
        queued: "Zaradené: %{runs}. Beží na pozadí, táto stránka ho sleduje a obnoví sa, keď skončí."
      runs:
        title: Zmeny
        help: Vykonané zmeny, posledných 30.
        none: Zatiaľ žiadne zmeny.
      show_run:
        title: "Zmena #%{id}"
        heading: "Zmena #%{id}: %{step}"
        waits: Čaká, kým skončí iná zmena.
        output: Výstup
        nothing_yet: (zatiaľ nič)
      conflicts:
        title: Nezrovnalosti
        count: "Skupiny s tiketmi, ktoré nevlastní vlastník podľa spúšťača: %{count}"
        help: „Náhľad presunu“ nič nemení.
        none: Žiadne nezrovnalosti.
        owns_here: tu vlastní %{count}
        preview_move: Náhľad presunu vlastníkovi podľa spúšťača
